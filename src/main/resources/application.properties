spring.application.name=mysecure

server.port=9000
spring.datasource.url=jdbc:postgresql://localhost:5432/mysecure
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health,info

mysecure.openapi.connect-timeout=5000
mysecure.openapi.read-timeout=10000

mysecure.scanners.rate-limit.request-count=20
mysecure.scanners.rate-limit.max-request-count=30
mysecure.scanners.rate-limit.delay-ms=100
mysecure.scanners.rate-limit.timeout-ms=5000
mysecure.scanners.rate-limit.latency-increase-threshold=2.0